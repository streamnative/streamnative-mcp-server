name: E2E Tests

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  pulsar-e2e:
    runs-on: ubuntu-latest

    services:
      pulsar:
        image: apachepulsar/pulsar:3.3.0
        ports:
          - 6650:6650
          - 8080:8080
        options: >-
          --entrypoint /bin/bash
          -v ${{ github.workspace }}/scripts/pulsar-e2e-entrypoint.sh:/pulsar-entrypoint.sh
          --health-cmd "curl -f http://localhost:8080/admin/v2/clusters"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 90s
          /pulsar-entrypoint.sh

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Download dependencies
        run: go mod download

      - name: Run E2E tests
        run: go test -v -tags=e2e -race ./pkg/mcp/e2e/...
        env:
          PULSAR_ADMIN_URL: http://localhost:8080
          PULSAR_SERVICE_URL: pulsar://localhost:6650
