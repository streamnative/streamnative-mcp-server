apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "snmcp.fullname" . }}
  labels:
    {{- include "snmcp.labels" . | nindent 4 }}
data:
  SNMCP_PULSAR_WEB_SERVICE_URL: {{ .Values.pulsar.webServiceURL | quote }}
  {{- if .Values.pulsar.serviceURL }}
  SNMCP_PULSAR_SERVICE_URL: {{ .Values.pulsar.serviceURL | quote }}
  {{- end }}
  SNMCP_SESSION_CACHE_SIZE: {{ .Values.session.cacheSize | quote }}
  SNMCP_SESSION_TTL_MINUTES: {{ .Values.session.ttlMinutes | quote }}
  SNMCP_HTTP_ADDR: {{ .Values.server.httpAddr | quote }}
  SNMCP_HTTP_PATH: {{ .Values.server.httpPath | quote }}
  SNMCP_CONFIG_DIR: {{ .Values.server.configDir | quote }}
  SNMCP_READ_ONLY: {{ .Values.server.readOnly | quote }}
  {{- if .Values.server.features }}
  SNMCP_FEATURES: {{ .Values.server.features | join "," | quote }}
  {{- end }}
  {{- if .Values.pulsar.tls.enabled }}
  SNMCP_PULSAR_TLS_ALLOW_INSECURE: {{ .Values.pulsar.tls.allowInsecureConnection | quote }}
  SNMCP_PULSAR_TLS_HOSTNAME_VERIFICATION: {{ .Values.pulsar.tls.enableHostnameVerification | quote }}
  {{- if .Values.pulsar.tls.trustCertsFilePath }}
  SNMCP_PULSAR_TLS_TRUST_CERTS_PATH: {{ .Values.pulsar.tls.trustCertsFilePath | quote }}
  {{- end }}
  {{- if .Values.pulsar.tls.certFile }}
  SNMCP_PULSAR_TLS_CERT_FILE: {{ .Values.pulsar.tls.certFile | quote }}
  {{- end }}
  {{- if .Values.pulsar.tls.keyFile }}
  SNMCP_PULSAR_TLS_KEY_FILE: {{ .Values.pulsar.tls.keyFile | quote }}
  {{- end }}
  {{- end }}
