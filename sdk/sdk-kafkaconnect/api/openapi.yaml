openapi: 3.0.1
info:
  title: Kafka Connect With Pulsar API
  version: 0.0.1
servers:
- url: /admin/kafkaconnect
paths:
  /:
    get:
      operationId: serverInfo
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerInfo'
          description: Connect worker details
      security:
      - basicAuth: []
  /connector-plugins:
    get:
      operationId: listConnectorPlugins
      parameters:
      - description: Whether to list only connectors instead of all plugins
        explode: true
        in: query
        name: connectorsOnly
        required: false
        schema:
          default: true
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PluginInfo'
                type: array
          description: Connector plugins
        "4XX":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Client error
        "5XX":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Server error
      security:
      - basicAuth: []
      summary: List all connector plugins installed
  /connector-plugins/catalog:
    get:
      operationId: listConnectorPluginsCatalog
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FunctionMeshConnectorDefinition'
                type: array
          description: Connector catalog
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal server error
      security:
      - basicAuth: []
      summary: List all connector catalog
  /connector-plugins/{pluginName}/config:
    get:
      operationId: getConnectorConfigDef
      parameters:
      - explode: false
        in: path
        name: pluginName
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ConfigKeyInfo'
                type: array
          description: Connector configuration definition
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Connector plugin not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal server error
      security:
      - basicAuth: []
      summary: Get the configuration definition for the specified pluginName
  /connector-plugins/{pluginName}/config/validate:
    put:
      operationId: validateConfigs
      parameters:
      - explode: false
        in: path
        name: pluginName
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties:
                type: string
              type: object
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Validation endpoint is not supported
      security:
      - basicAuth: []
      summary: Validate the provided configuration against the configuration definition
        for the specified pluginName
  /connectors:
    get:
      operationId: listConnectors
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Active connectors
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The requester doesn't have permission to perform this operation
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal server error
      security:
      - basicAuth: []
    post:
      operationId: createConnector
      parameters:
      - explode: true
        in: query
        name: forward
        required: false
        schema:
          type: boolean
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConnectorRequest'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorInfo'
          description: Connector created successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Invalid connector configuration
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The requester doesn't have permission to perform this operation
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Connector already exists or request conflicts with current
            state
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal server error
      security:
      - basicAuth: []
  /connectors/{connector}:
    delete:
      operationId: destroyConnector
      parameters:
      - explode: false
        in: path
        name: connector
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: forward
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "204":
          description: Connector deleted successfully
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The requester doesn't have permission to perform this operation
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Connector not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal server error
      security:
      - basicAuth: []
    get:
      operationId: getConnector
      parameters:
      - explode: false
        in: path
        name: connector
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorInfo'
          description: Connector details
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The requester doesn't have permission to perform this operation
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Connector not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal server error
      security:
      - basicAuth: []
  /connectors/{connector}/config:
    get:
      operationId: getConnectorConfig
      parameters:
      - explode: false
        in: path
        name: connector
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Connector configuration
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The requester doesn't have permission to perform this operation
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Connector not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal server error
      security:
      - basicAuth: []
    put:
      operationId: putConnectorConfig
      parameters:
      - explode: false
        in: path
        name: connector
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: forward
        required: false
        schema:
          type: boolean
        style: form
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties:
                type: string
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorInfo'
          description: Connector updated successfully
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorInfo'
          description: Connector created successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Invalid connector configuration
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The requester doesn't have permission to perform this operation
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Connector not found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Request conflicts with current connector state
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal server error
      security:
      - basicAuth: []
  /connectors/{connector}/offsets:
    delete:
      operationId: resetConnectorOffsets
      parameters:
      - explode: true
        in: query
        name: forward
        required: false
        schema:
          type: boolean
        style: form
      - explode: false
        in: path
        name: connector
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Offsets reset successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Invalid offsets request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The requester doesn't have permission to perform this operation
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Connector not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal server error
      security:
      - basicAuth: []
    get:
      operationId: getOffsets
      parameters:
      - explode: false
        in: path
        name: connector
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorOffsets'
          description: Connector offsets
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The requester doesn't have permission to perform this operation
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Connector not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal server error
      security:
      - basicAuth: []
    patch:
      operationId: alterConnectorOffsets
      parameters:
      - explode: true
        in: query
        name: forward
        required: false
        schema:
          type: boolean
        style: form
      - explode: false
        in: path
        name: connector
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorOffsets'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: Offsets altered successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Invalid offsets request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The requester doesn't have permission to perform this operation
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Connector not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal server error
      security:
      - basicAuth: []
  /connectors/{connector}/pause:
    put:
      operationId: pauseConnector
      parameters:
      - explode: false
        in: path
        name: connector
        required: true
        schema:
          type: string
        style: simple
      responses:
        "202":
          description: Pause request accepted
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The requester doesn't have permission to perform this operation
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Connector not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal server error
      security:
      - basicAuth: []
  /connectors/{connector}/restart:
    post:
      operationId: restartConnector
      parameters:
      - explode: false
        in: path
        name: connector
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: includeTasks
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - explode: true
        in: query
        name: onlyFailed
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - explode: true
        in: query
        name: forward
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorStateInfo'
          description: Restart request accepted
        "204":
          description: Connector restarted without task payload
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Invalid restart request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The requester doesn't have permission to perform this operation
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Connector not found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Request conflicts with current connector state
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal server error
      security:
      - basicAuth: []
  /connectors/{connector}/resume:
    put:
      operationId: resumeConnector
      parameters:
      - explode: false
        in: path
        name: connector
        required: true
        schema:
          type: string
        style: simple
      responses:
        "202":
          description: Resume request accepted
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The requester doesn't have permission to perform this operation
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Connector not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal server error
      security:
      - basicAuth: []
  /connectors/{connector}/status:
    get:
      operationId: getConnectorStatus
      parameters:
      - explode: false
        in: path
        name: connector
        required: true
        schema:
          type: string
        style: simple
