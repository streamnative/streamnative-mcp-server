          description: Connector not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal server error
      security:
      - basicAuth: []
  /connectors/{connector}/tasks/{task}/restart:
    post:
      operationId: restartTask
      parameters:
      - explode: false
        in: path
        name: connector
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: task
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - explode: true
        in: query
        name: forward
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "204":
          description: Task restarted successfully
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Invalid restart request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The requester doesn't have permission to perform this operation
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Connector or task not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal server error
      security:
      - basicAuth: []
  /connectors/{connector}/tasks/{task}/status:
    get:
      operationId: getTaskStatus
      parameters:
      - explode: false
        in: path
        name: connector
        required: true
        schema:
