          description: The requester doesn't have permission to perform this operation
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Connector not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal server error
      security:
      - basicAuth: []
  /connectors/{connector}/stop:
    put:
      operationId: stopConnector
      parameters:
      - explode: false
        in: path
        name: connector
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: forward
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "202":
          description: Stop request accepted
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The requester doesn't have permission to perform this operation
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Connector not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal server error
      security:
      - basicAuth: []
  /connectors/{connector}/tasks:
    get:
      operationId: getTaskConfigs
      parameters:
      - explode: false
        in: path
        name: connector
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TaskInfo'
                type: array
          description: Task configurations
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The requester doesn't have permission to perform this operation
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Connector not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal server error
      security:
      - basicAuth: []
  /connectors/{connector}/tasks-config:
    get:
      deprecated: true
      operationId: getTasksConfig
      parameters:
      - explode: false
        in: path
        name: connector
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Task configurations
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The requester doesn't have permission to perform this operation
        "404":
          content:
            application/json:
