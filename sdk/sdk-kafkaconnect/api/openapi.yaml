          description: Task status
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The requester doesn't have permission to perform this operation
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Connector or task not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal server error
      security:
      - basicAuth: []
  /connectors/{connector}/topics:
    get:
      operationId: getConnectorActiveTopics
      parameters:
      - explode: false
        in: path
        name: connector
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Connector active topics
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
