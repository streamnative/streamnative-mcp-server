      - basicAuth: []
  /connectors/{connector}/topics/reset:
    put:
      operationId: resetConnectorActiveTopics
      parameters:
      - explode: false
        in: path
        name: connector
        required: true
        schema:
          type: string
        style: simple
      responses:
        "202":
          description: Active topics reset request accepted
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The requester doesn't have permission to perform this operation
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Connector not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal server error
      security:
      - basicAuth: []
  /connectors/{connector}/topics:reset:
    put:
      operationId: resetConnectorActiveTopicsV2
      parameters:
      - explode: false
        in: path
        name: connector
        required: true
        schema:
          type: string
        style: simple
      responses:
        "202":
          description: Active topics reset request accepted
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The requester doesn't have permission to perform this operation
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Connector not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal server error
      security:
      - basicAuth: []
  /connectors/{connector}:pause:
    put:
      operationId: pauseConnectorV2
      parameters:
      - explode: false
        in: path
        name: connector
        required: true
        schema:
          type: string
        style: simple
      responses:
        "202":
          description: Pause request accepted
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: The requester doesn't have permission to perform this operation
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Connector not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal server error
      security:
      - basicAuth: []
  /connectors/{connector}:restart:
    post:
      operationId: restartConnectorV2
      parameters:
      - explode: false
        in: path
        name: connector
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: includeTasks
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - explode: true
        in: query
        name: onlyFailed
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - explode: true
        in: query
        name: forward
        required: false
