        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Connector not found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Request conflicts with current connector state
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
          description: Internal server error
