version: 2
project_name: streamnative-mcp-server
before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: snmcp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./cmd/streamnative-mcp-server
    binary: snmcp

archives:
  - id: snmcp
    formats: tar.gz
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: zip

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: false
  prerelease: auto
  name_template: "StreamNative MCP Server {{.Version}}"

dockers:
  - image_templates:
      - "streamnative/snmcp:{{ .Tag }}-amd64"
      - "streamnative/snmcp:latest-amd64"
    dockerfile: Dockerfile.goreleaser
    goos: linux
    goarch: amd64
  - image_templates:
      - "streamnative/snmcp:{{ .Tag }}-arm64"
      - "streamnative/snmcp:latest-arm64"
    dockerfile: Dockerfile.goreleaser
    goos: linux
    goarch: arm64

docker_manifests:
  - name_template: "streamnative/snmcp:{{ .Tag }}"
    image_templates:
      - "streamnative/snmcp:{{ .Tag }}-amd64"
      - "streamnative/snmcp:{{ .Tag }}-arm64"
  - name_template: "streamnative/snmcp:latest"
    image_templates:
      - "streamnative/snmcp:latest-amd64"
      - "streamnative/snmcp:latest-arm64"

brews:
  - name: snmcp
    skip_upload: true
    repository:
      owner: streamnative
      name: homebrew-streamnative
    commit_author:
      name: streamnativebot
      email: streamnativebot@streamnative.io
    directory: Formula
    homepage: "https://streamnative.io/"
    description: "StreamNative MCP Server (snmcp)"
    license: "Apache-2.0"