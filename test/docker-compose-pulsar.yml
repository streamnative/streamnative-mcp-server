services:
  pulsar:
    image: apachepulsar/pulsar:3.3.0
    container_name: snmcp-pulsar-standalone
    ports:
      - "6650:6650"   # Pulsar binary protocol
      - "8080:8080"   # Admin REST API
      - "8443:8443"   # Pulsar binary protocol TLS
      - "8181:8181"   # Admin REST API TLS
    environment:
      - PULSAR_PREFIX=pulsar-standalone
    command: >
      bin/pulsar standalone
    networks:
      - pulsar-test
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/admin/v2/clusters"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  pulsar-test:
    driver: bridge
